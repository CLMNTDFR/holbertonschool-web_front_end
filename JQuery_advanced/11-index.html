<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>

        <meta charset="utf-8" />
        <title>Task 11</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script type="application/javascript">
            function addPostRow(data) {
                $('body').append(
                    $('<p></p>').append(
                        $('<span></span>').text('Post created with id ' + data.id + ', title: ' + data.title + ', author: ' + data.author)
                    )
                );
            }

            function listPosts() {
                $.get('http://localhost:3000/posts', function (response, status, xhr) {
                    if (xhr.status === 200) {
                        $.each(response, function (index, post) {
                            addPostRow(post);
                        });
                    }
                }).fail(function () {
                    alert('Server Error');
                });
            }

            function buildForm() {
                $('body').append(
                    $('<form></form>').append(
                        $('<div></div>').append(
                            $('<label></label>').attr('for', 'author').text('Author'),
                            $('<input type="text" id="author">')
                        ),
                        $('<div></div>').append(
                            $('<label></label>').attr('for', 'title').text('Title'),
                            $('<textarea id="title"></textarea>')
                        ),
                        $('<input type="submit">')
                    ).submit(function (e) {
                        e.preventDefault();
                        sendForm();
                    })
                );
            }

            function sendForm() {
                $('form').after('About to send the query to the API');
                const data = {
                    title: $('#title').val(),
                    author: $('#author').val()
                };

                $.ajax({
                    url: 'http://localhost:3000/posts',
                    type: 'POST',
                    data: data,
                    success: function (response) {
                        addPostRow(response);
                    },
                    error: function () {
                        alert('Error sending the POST query');
                    }
                });
            }

            $(function () {
                listPosts();
                buildForm();
            });
        </script>
    </head>

    <body>

    </body>

</html>
